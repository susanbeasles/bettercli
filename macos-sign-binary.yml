name: macos-sign-binary

# Signs a real Mach-O executable, then wraps it in a stapled installer package.
#
# WHY BOTH, AND WHY THIS REPLACES THE SCRIPT-TREE APPROACH
#
# A signed .pkg proves the bytes were authentic in transit. The installer checks it
# once and discards it. If the payload is a directory of shell scripts, what remains on
# disk afterwards has no signature at all, and anything that can write that directory
# owns the tool from then on.
#
# A signed Mach-O is different in kind. The signature lives in the binary, and macOS
# verifies it on every exec: AMFI validates the code directory hashes as pages are
# faulted in. Modify one byte and the kernel refuses to run it — SIGKILL, not a
# warning. That is the seal that survives installation.
#
# Two certificates, for two different jobs:
#
#   Developer ID Application  -> signs the executable      (checked at every exec)
#   Developer ID Installer    -> signs the .pkg            (checked at install)
#
# The earlier version of this workflow had only the Installer certificate. That signed
# the wrapper around unsigned content, which is the hole this exists to close.
#
# Notarisation asymmetry worth knowing: a bare executable cannot be stapled. Stapling
# attaches the ticket to a .app, .dmg or .pkg. So the binary is notarised (its ticket
# is resolved online, and cached by the OS), and the .pkg is notarised AND stapled so a
# first install works with no network.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact_name:
        description: Artifact holding the compiled per-architecture binaries
        required: false
        default: cfezcli-binaries
        type: string
      repo:
        required: false
        default: ${{ github.repository }}
        type: string
    outputs:
      signed:
        value: ${{ jobs.sign.outputs.signed }}
      pkg_artifact:
        value: ${{ jobs.sign.outputs.pkg_artifact }}
      binary_sha256:
        value: ${{ jobs.sign.outputs.binary_sha256 }}
      pkg_sha256:
        value: ${{ jobs.sign.outputs.pkg_sha256 }}
    secrets:
      APPLE_APPLICATION_CERT_P12:
        description: Base64 Developer ID Application .p12 — signs the executable
        required: false
      APPLE_APPLICATION_CERT_PASSWORD:
        required: false
      APPLE_INSTALLER_CERT_P12:
        description: Base64 Developer ID Installer .p12 — signs the .pkg
        required: false
      APPLE_INSTALLER_CERT_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false

permissions:
  contents: read

jobs:
  sign:
    name: sign and notarise the binary
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.result.outputs.signed }}
      pkg_artifact: ${{ steps.result.outputs.pkg_artifact }}
      binary_sha256: ${{ steps.result.outputs.binary_sha256 }}
      pkg_sha256: ${{ steps.result.outputs.pkg_sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      BUNDLE_ID: com.sonarmd.cfezcli
      INSTALL_DIR: /usr/local/bin
    steps:
      - name: Check whether signing is configured
        id: configured
        env:
          APP_CERT: ${{ secrets.APPLE_APPLICATION_CERT_P12 }}
          PKG_CERT: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APP_CERT:-}" ] || missing="$missing APPLE_APPLICATION_CERT_P12"
          [ -n "${PKG_CERT:-}" ] || missing="$missing APPLE_INSTALLER_CERT_P12"
          [ -n "${KEY_ID:-}" ]   || missing="$missing APPLE_API_KEY_ID"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### macOS signing skipped"
              echo
              echo "Missing secrets: \`$missing\`"
              echo
              echo "An unsigned binary will not be published: a release that claims to be"
              echo "signed and is not is worse than one that never claimed it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.configured.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Fetch the compiled binaries
        if: steps.configured.outputs.configured == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Verify provenance before signing anything
        if: steps.configured.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Signing is an endorsement. Endorsing an artifact whose provenance was never
          # checked would let a tampered binary inherit the Developer ID, which is worse
          # than shipping unsigned.
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            bin="build/$arch/cf"
            test -f "$bin" || { echo "::error::missing $bin"; exit 1; }
            gh attestation verify "$bin" --repo "${{ inputs.repo }}" \
              --deny-self-hosted-runners \
              || { echo "::error::attestation failed for $arch — refusing to sign"; exit 1; }
            echo "verified $arch"
          done

      - name: Create an ephemeral keychain and import both identities
        if: steps.configured.outputs.configured == 'true'
        env:
          APP_CERT: ${{ secrets.APPLE_APPLICATION_CERT_P12 }}
          APP_PASS: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          PKG_CERT: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          PKG_PASS: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # A dedicated keychain, never the login keychain: that one is shared with
          # whatever else the job does and is unlocked by default.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          import_identity() {
            local b64="$1" pass="$2" label="$3"
            printf '%s' "$b64" | base64 --decode > "$RUNNER_TEMP/$label.p12"
            security import "$RUNNER_TEMP/$label.p12" -k "$KEYCHAIN" -P "$pass" \
              -T /usr/bin/codesign -T /usr/bin/productsign -f pkcs12 -A >/dev/null
            rm -f "$RUNNER_TEMP/$label.p12"
          }
          import_identity "$APP_CERT" "$APP_PASS" application
          import_identity "$PKG_CERT" "$PKG_PASS" installer

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Prepend rather than replace: the system roots must stay searchable or the
          # certificate chain cannot be validated.
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"

          app_id="$(security find-identity -v "$KEYCHAIN" \
                    | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          pkg_id="$(security find-identity -v "$KEYCHAIN" \
                    | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          [ -n "$app_id" ] || { echo "::error::no Developer ID Application identity found"; exit 1; }
          [ -n "$pkg_id" ] || { echo "::error::no Developer ID Installer identity found"; exit 1; }
          echo "APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "PKG_IDENTITY=$pkg_id" >> "$GITHUB_ENV"
          echo "application: $app_id"
          echo "installer:   $pkg_id"

      - name: Build a universal binary
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # One binary that runs natively on Apple Silicon and Intel. Shipping two and
          # asking the user to pick is how people end up running the wrong one.
          lipo -create -output "$RUNNER_TEMP/cf" \
            build/aarch64-apple-darwin/cf \
            build/x86_64-apple-darwin/cf
          chmod 755 "$RUNNER_TEMP/cf"
          lipo -info "$RUNNER_TEMP/cf"
          file "$RUNNER_TEMP/cf"

      - name: Sign the executable with the hardened runtime
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # --options runtime enables the hardened runtime, which notarisation requires.
          # --timestamp binds a trusted timestamp so the signature outlives the
          # certificate's expiry.
          codesign --force --timestamp --options runtime \
            --identifier "$BUNDLE_ID" \
            --sign "$APP_IDENTITY" \
            --keychain "$KEYCHAIN" \
            "$RUNNER_TEMP/cf"

          # --strict makes codesign reject a signature it would otherwise merely warn
          # about, which is the difference between checking and appearing to check.
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/cf"
          codesign --display --verbose=4 "$RUNNER_TEMP/cf" 2>&1 | sed 's/^/    /'

      - name: Notarise the executable
        if: steps.configured.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8" > "$KEYFILE"; chmod 600 "$KEYFILE"

          # notarytool takes an archive, not a bare file. ditto preserves the resource
          # fork and extended attributes that zip would drop.
          ditto -c -k --keepParent "$RUNNER_TEMP/cf" "$RUNNER_TEMP/cf.zip"

          set +e
          OUT="$(xcrun notarytool submit "$RUNNER_TEMP/cf.zip" \
                  --key "$KEYFILE" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
                  --wait --timeout 30m --output-format json 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          STATUS="$(printf '%s' "$OUT" | sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p' | tail -1)"

          if [ "$RC" -ne 0 ] || [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarisation failed (status: ${STATUS:-unknown})"
            ID="$(printf '%s' "$OUT" | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -1)"
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" \
                --key "$KEYFILE" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
          fi
            rm -f "$KEYFILE"
            exit 1
          fi
          rm -f "$KEYFILE"

          # A bare executable cannot be stapled — stapling targets .app, .dmg and .pkg.
          # The ticket is resolved online on first use and cached by the OS. The .pkg
          # below carries a stapled ticket so a first install needs no network.
          echo "notarised; ticket is online-resolved for the bare binary"

      - name: Package the signed binary and sign the package
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$ROOT$INSTALL_DIR"
          cp "$RUNNER_TEMP/cf" "$ROOT$INSTALL_DIR/cf"
          chmod 755 "$ROOT$INSTALL_DIR/cf"

          # No postinstall script. The payload is one signed executable; a script here
          # would be unsigned code running as root, which is the problem we just left.
          pkgbuild \
            --root "$ROOT" \
            --identifier "$BUNDLE_ID" \
            --version "$VERSION" \
            --install-location / \
            --ownership recommended \
            "$RUNNER_TEMP/cfezcli-unsigned.pkg"

          productsign --sign "$PKG_IDENTITY" --keychain "$KEYCHAIN" \
            "$RUNNER_TEMP/cfezcli-unsigned.pkg" "dist/cfezcli-$VERSION.pkg"
          pkgutil --check-signature "dist/cfezcli-$VERSION.pkg"

      - name: Notarise and staple the package
        if: steps.configured.outputs.configured == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8" > "$KEYFILE"; chmod 600 "$KEYFILE"
          PKG="dist/cfezcli-$VERSION.pkg"

          set +e
          OUT="$(xcrun notarytool submit "$PKG" \
                  --key "$KEYFILE" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
                  --wait --timeout 30m --output-format json 2>&1)"
          RC=$?
          set -e
          rm -f "$KEYFILE"
          printf '%s\n' "$OUT"
          STATUS="$(printf '%s' "$OUT" | sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p' | tail -1)"
          if [ "$RC" -ne 0 ] || [ "$STATUS" != Accepted ]; then
            echo "::error::package notarisation failed (${STATUS:-unknown})"
            exit 1
          fi

          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

      - name: Verify exactly as an end user's machine will
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          PKG="dist/cfezcli-$VERSION.pkg"

          echo "--- installer signature ---"
          pkgutil --check-signature "$PKG"
          spctl -a -vv -t install "$PKG"

          echo "--- install it ---"
          sudo installer -pkg "$PKG" -target / -verbose

          echo "--- the installed binary, as the kernel sees it ---"
          codesign --verify --deep --strict --verbose=4 "$INSTALL_DIR/cf"
          spctl -a -vv -t exec "$INSTALL_DIR/cf"
          codesign --display --verbose=2 "$INSTALL_DIR/cf" 2>&1 | sed 's/^/    /'

          echo "--- it runs ---"
          "$INSTALL_DIR/cf" --version

          # The property that the script tree could never have. One byte changed and the
          # kernel refuses to exec: the signature is verified per page at fault time, not
          # once at install. This asserts the seal is real rather than assuming it.
          echo "--- tamper test: the OS must refuse a modified binary ---"
          sudo cp "$INSTALL_DIR/cf" "$RUNNER_TEMP/cf.orig"
          sudo perl -0777 -pe 's/\xCF\xFA/\xCF\xFA/' -i "$INSTALL_DIR/cf"   # touch without changing
          printf 'x' | sudo dd of="$INSTALL_DIR/cf" bs=1 seek=$((0x9000)) conv=notrunc status=none

          if codesign --verify --strict "$INSTALL_DIR/cf" 2>/dev/null; then
            echo "::error::codesign accepted a modified binary — the seal is not working"
            sudo cp "$RUNNER_TEMP/cf.orig" "$INSTALL_DIR/cf"
            exit 1
          fi
          echo "    codesign rejects the modified binary, as required"

          if "$INSTALL_DIR/cf" --version >/dev/null 2>&1; then
            echo "::warning::the modified binary still executed; Gatekeeper assessment may be disabled on this runner"
          else
            echo "    the OS refuses to execute the modified binary"
          fi
          sudo cp "$RUNNER_TEMP/cf.orig" "$INSTALL_DIR/cf"
          codesign --verify --strict "$INSTALL_DIR/cf"
          echo "    restored and verifying again"

      - name: Record the result
        id: result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.configured.outputs.configured }}" != true ]; then
            {
              echo "signed=false"
              echo "pkg_artifact="
              echo "binary_sha256="
              echo "pkg_sha256="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BIN_SHA="$(shasum -a 256 "$RUNNER_TEMP/cf" | awk '{print $1}')"
          PKG_SHA="$(shasum -a 256 "dist/cfezcli-$VERSION.pkg" | awk '{print $1}')"
          mkdir -p dist
          cp "$RUNNER_TEMP/cf" "dist/cf-macos-universal"
          {
            echo "signed=true"
            echo "pkg_artifact=cfezcli-macos-signed"
            echo "binary_sha256=$BIN_SHA"
            echo "pkg_sha256=$PKG_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### macOS binary signed and notarised"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| executable identity | \`$APP_IDENTITY\` |"
            echo "| installer identity | \`$PKG_IDENTITY\` |"
            echo "| architectures | arm64 + x86_64 (universal) |"
            echo "| hardened runtime | enabled |"
            echo "| notarised | executable and package |"
            echo "| stapled | package |"
            echo "| binary sha256 | \`$BIN_SHA\` |"
            echo "| pkg sha256 | \`$PKG_SHA\` |"
            echo
            echo "A modified binary is rejected by \`codesign --verify --strict\`; verified"
            echo "in this job by tampering with an installed copy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed artifacts
        if: steps.result.outputs.signed == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cfezcli-macos-signed
          path: |
            dist/cfezcli-${{ inputs.version }}.pkg
            dist/cf-macos-universal
          retention-days: 90
          if-no-files-found: error

      - name: Destroy the signing keychain
        if: always()
        run: |
          set +e
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/AuthKey.p8 2>/dev/null
          echo "signing material removed"
          exit 0
